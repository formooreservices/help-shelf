<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Complete — Help-Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<header class="site-header admin-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark">⌂</span>
      <span class="brand-name">Help&#8209;Shelf</span>
    </div>
    <a href="index.html" class="back-link">← Back to shelf</a>
  </div>
</header>

<main class="admin-main">
  <section class="admin-panel" id="result-panel">
    <p class="empty-state">Confirming your order…</p>
  </section>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");
const panel = document.getElementById("result-panel");

async function poll(attempt = 0) {
  if (!sessionId) {
    panel.innerHTML = '<p class="empty-state">No order reference found.</p>';
    return;
  }
  try {
    const res = await fetch(`/.netlify/functions/get-order?session_id=${encodeURIComponent(sessionId)}`);
    if (res.status === 202 && attempt < 8) {
      setTimeout(() => poll(attempt + 1), 1500);
      return;
    }
    const data = await res.json();
    if (!data.license_key) {
      panel.innerHTML = '<p class="empty-state">Still processing — refresh this page in a moment.</p>';
      return;
    }
    panel.innerHTML = `
      <h2 style="font-family: var(--font-display); margin-top:0;">Thanks for your order!</h2>
      <p>${data.product_title}</p>
      <p style="font-family: var(--font-mono); font-size:1.3rem; color: var(--accent); margin: 1rem 0;">${data.license_key}</p>
      <p style="color: var(--ink-muted); font-size: 0.85rem;">
        Save this key — includes ${data.max_downloads} downloads, valid until ${new Date(data.expires_at).toLocaleDateString()}.
      </p>
      <a href="download.html?key=${encodeURIComponent(data.license_key)}" class="buy-btn" style="display:block; text-align:center; text-decoration:none; margin-top:1rem;">Download Now</a>
    `;
  } catch (err) {
    panel.innerHTML = '<p class="empty-state">Something went wrong confirming your order.</p>';
  }
}

poll();
</script>
</body>
</html>
