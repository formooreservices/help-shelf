<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Download — Help-Shelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<header class="site-header admin-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark">⌂</span>
      <span class="brand-name">Help&#8209;Shelf</span>
    </div>
    <a href="index.html" class="back-link">← Back to shelf</a>
  </div>
</header>

<main class="admin-main">
  <section class="admin-panel">
    <h2>Redeem a License Key</h2>
    <form id="dl-form" class="admin-form">
      <input type="text" id="dl-key" placeholder="e.g. HS-XXXX-XXXX-XXXX" required />
      <button type="submit">Get Download Link</button>
      <p id="dl-status" class="form-status"></p>
    </form>
  </section>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const prefill = params.get("key");
if (prefill) document.getElementById("dl-key").value = prefill;

document.getElementById("dl-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const status = document.getElementById("dl-status");
  const submitBtn = document.querySelector("#dl-form button[type=submit]");
  const key = document.getElementById("dl-key").value.trim();
  status.textContent = "Checking…";

  try {
    const res = await fetch(`/.netlify/functions/download?key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if (!res.ok) {
      status.textContent = data.error || "Something went wrong.";
      return;
    }
    submitBtn.classList.add("secondary-btn");
    submitBtn.textContent = "Get a New Link";
    status.innerHTML = `
      <p style="margin-bottom:0.6rem;">Downloads remaining: ${data.downloads_remaining}</p>
      <a href="${data.url}" class="buy-btn" style="display:block; text-align:center; text-decoration:none; margin-bottom:0.5rem;">Download ${data.product_title}</a>
      <p style="font-size:0.72rem; color: var(--ink-muted);">Link expires in 60 seconds — if it stops working, click "Get a New Link" above.</p>
    `;
  } catch (err) {
    status.textContent = "Something went wrong. Try again.";
  }
});

if (prefill) document.getElementById("dl-form").requestSubmit();
</script>
</body>
</html>
