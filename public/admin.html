<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Help-Shelf — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div id="gate" class="gate-screen">
  <div class="gate-box">
    <p class="gate-label">Help-Shelf Admin</p>
    <input type="password" id="gate-pass" placeholder="Passcode" />
    <button onclick="checkGate()">Enter</button>
    <p id="gate-error" class="gate-error"></p>
  </div>
</div>

<div id="admin-app" class="admin-app hidden">
  <header class="site-header admin-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">⌂</span>
        <span class="brand-name">Help&#8209;Shelf</span>
      </div>
      <a href="index.html" class="back-link">← View storefront</a>
    </div>
  </header>

  <main class="admin-main">

    <section class="admin-panel">
      <h2>Add a Vendor</h2>
      <form id="vendor-form" class="admin-form">
        <input type="text" id="v-name" placeholder="Vendor name" required />
        <input type="email" id="v-email" placeholder="Vendor email" required />
        <button type="submit">Add Vendor</button>
      </form>
      <div id="vendor-list" class="chip-list"></div>
    </section>

    <section class="admin-panel">
      <h2 id="product-form-heading">Add a Product</h2>
      <form id="product-form" class="admin-form">
        <label>Vendor
          <select id="p-vendor" required></select>
        </label>

        <label>Category
          <select id="p-category" required></select>
        </label>

        <label>Title
          <input type="text" id="p-title" required />
        </label>

        <label>Description
          <textarea id="p-desc" rows="3"></textarea>
        </label>

        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="p-is-service" />
            This is a service (no file, buyer submits a request instead)
          </label>
        </div>

        <label id="price-label">Price (USD)
          <input type="number" id="p-price" step="0.01" min="0" value="0" />
        </label>

        <div id="license-fields">
          <label>Download limit
            <input type="number" id="p-download-limit" value="3" min="1" />
          </label>
          <label>License valid for (days)
            <input type="number" id="p-license-days" value="7" min="1" />
          </label>
        </div>

        <label>Thumbnail image
          <input type="file" id="p-thumbnail" accept="image/*" />
        </label>

        <label id="deliverable-label">Product file (the thing they're buying)
          <input type="file" id="p-file" />
        </label>

        <div class="form-btn-row">
          <button type="submit" id="p-submit">Add Product</button>
          <button type="button" id="p-cancel-edit" class="cancel-btn hidden" onclick="cancelEdit()">Cancel edit</button>
        </div>
        <p id="p-status" class="form-status"></p>
      </form>
    </section>

    <section class="admin-panel">
      <h2>Products</h2>
      <div id="admin-product-list" class="admin-product-list">
        <p class="empty-state">Loading…</p>
      </div>
    </section>

<section class="admin-panel">
      <h2>Order History</h2>
      <div id="admin-order-list" class="admin-product-list">
        <p class="empty-state">Loading…</p>
      </div>
    </section>

  </main>




  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
