<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Help-Shelf — Digital Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark">⌂</span>
      <span class="brand-name">Help&#8209;Shelf</span>
    </div>
    <p class="tagline">Digital goods, put up proper.</p>
  </div>
  <nav id="category-nav" class="category-nav"></nav>
</header>

<main class="shelf-container">
  <div id="product-grid" class="product-grid">
    <p class="empty-state">Loading the shelf…</p>
  </div>
</main>

<footer class="site-footer">
  <p>Help-Shelf — a small marketplace, carefully stocked.</p>
</footer>

<div id="product-modal" class="modal-overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal-panel">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
</body>
</html>
